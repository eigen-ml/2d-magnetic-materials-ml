# Production stack: the API behind Caddy (automatic HTTPS via Let's Encrypt).
# Run from the repository root:
#   DOMAIN=2dml.example.com docker compose -f deploy/compose.prod.yml up -d --build
services:
  api:
    build: ..
    restart: unless-stopped
    # no published port: only Caddy can reach the API
    expose:
      - "8000"
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. 2dml.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
