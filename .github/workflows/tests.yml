name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-api.txt

      - name: Run lightweight tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t 2dml-api .

      - name: Start container and call the API
        run: |
          docker run -d --name api -p 8000:8000 2dml-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/model
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
               -d '{"formulas": ["CrI3", "MoS2"]}'

      - name: Container logs
        if: always()
        run: docker logs api || true
